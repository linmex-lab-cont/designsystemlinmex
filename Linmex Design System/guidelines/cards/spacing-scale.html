<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid — consistent rhythm across the system" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:26px 28px;background:var(--surface-card)}
  .row{display:flex;align-items:flex-end;gap:18px}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--orange-200);border-bottom:3px solid var(--orange-500)}
  .item b{font:var(--fw-bold) 12px/1 var(--font-heading);color:var(--color-ink)}
  .item span{font:var(--fw-medium) 11px/1 var(--font-condensed);letter-spacing:.06em;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><b>1</b><span>4</span></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><b>2</b><span>8</span></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><b>3</b><span>12</span></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><b>4</b><span>16</span></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><b>6</b><span>24</span></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><b>8</b><span>32</span></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><b>12</b><span>48</span></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><b>16</b><span>64</span></div>
    <div class="item"><div class="bar" style="width:80px;height:80px"></div><b>20</b><span>80</span></div>
  </div>
</body></html>
