<!-- @dsCard group="Colors" viewport="700x180" name="Primary · Orange (Modernidad)" subtitle="#FF5100 — the brand's single accent; tints by % over white" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-card)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .sw b{font:var(--fw-bold) 13px/1 var(--font-heading)}
  .sw span{font:var(--fw-semibold) 11px/1.4 var(--font-condensed);letter-spacing:.06em;opacity:.8}
  .cap{font:var(--fw-semibold) 11px/1 var(--font-condensed);letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 12px}
</style></head>
<body>
  <p class="cap">Naranja · Modernidad</p>
  <div class="row">
    <div class="sw" style="background:var(--orange-700);color:#fff"><b>700</b><span>#CF4205</span></div>
    <div class="sw" style="background:var(--orange-600);color:#fff"><b>600</b><span>#E84A08</span></div>
    <div class="sw" style="background:var(--orange-500);color:#fff"><b>500 ★</b><span>#FF5100</span></div>
    <div class="sw" style="background:var(--orange-400);color:#3a1500"><b>400</b><span>#FF7433</span></div>
    <div class="sw" style="background:var(--orange-300);color:#3a1500"><b>300</b><span>#FF9766</span></div>
    <div class="sw" style="background:var(--orange-200);color:#3a1500"><b>200</b><span>#FFB999</span></div>
    <div class="sw" style="background:var(--orange-100);color:#3a1500"><b>100</b><span>#FFDCCC</span></div>
  </div>
</body></html>
