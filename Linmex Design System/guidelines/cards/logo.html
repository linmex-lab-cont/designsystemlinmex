<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:0;background:var(--surface-card)}
  .grid{display:grid;grid-template-columns:1fr 1fr}
  .cell{height:230px;display:flex;align-items:center;justify-content:center;padding:0 40px;box-sizing:border-box}
  .light{background:var(--gray-50)}
  .dark{background:var(--navy-800)}
  .cell img{width:100%;max-width:280px;height:auto}
</style></head>
<body>
  <div class="grid">
    <div class="cell light">
      <img src="../../assets/logo/Linmex-Logo-Principal-Full%20Color.png" alt="Linmex — logotipo principal">
    </div>
    <div class="cell dark">
      <img src="../../assets/logo/Linmex-Logo-Blanco.png" alt="Linmex — logotipo en blanco">
    </div>
  </div>
</body></html>
