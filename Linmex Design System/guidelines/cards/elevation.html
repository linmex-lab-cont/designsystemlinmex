<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Soft neutral shadows + the brand orange glow for emphasis" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:30px 28px;background:var(--surface-page)}
  .row{display:flex;gap:24px}
  .item{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:88px;height:64px;background:var(--surface-card);border-radius:var(--radius-md)}
  .item b{font:var(--fw-bold) 12px/1 var(--font-heading);color:var(--color-ink)}
  .item span{font:var(--fw-medium) 11px/1 var(--font-condensed);letter-spacing:.06em;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><b>sm</b><span>cards</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><b>md</b><span>raised</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><b>lg</b><span>popover</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><b>xl</b><span>modal</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-orange);background:var(--orange-500)"></div><b>orange</b><span>CTA</span></div>
  </div>
</body></html>
