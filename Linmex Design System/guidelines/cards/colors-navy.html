<!-- @dsCard group="Colors" viewport="700x180" name="Ink · Navy (Formalidad)" subtitle="#0F1820 — Pantone 445 C; the brand's deep, formal base ink" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-card)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
  .sw b{font:var(--fw-bold) 13px/1 var(--font-heading)}
  .sw span{font:var(--fw-semibold) 11px/1.4 var(--font-condensed);letter-spacing:.06em;opacity:.75}
  .cap{font:var(--fw-semibold) 11px/1 var(--font-condensed);letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 12px}
</style></head>
<body>
  <p class="cap">Azul · Formalidad</p>
  <div class="row">
    <div class="sw" style="background:var(--navy-900)"><b>900</b><span>#0A1117</span></div>
    <div class="sw" style="background:var(--navy-800)"><b>800 ★</b><span>#0F1820</span></div>
    <div class="sw" style="background:var(--navy-700)"><b>700</b><span>#1A2630</span></div>
    <div class="sw" style="background:var(--navy-600)"><b>600</b><span>#283642</span></div>
    <div class="sw" style="background:var(--navy-500)"><b>500</b><span>#3A4A57</span></div>
  </div>
</body></html>
