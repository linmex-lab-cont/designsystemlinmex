<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:26px 28px;background:var(--surface-card);display:flex;align-items:center;justify-content:space-between;gap:24px}
  .wm{font-family:var(--font-logo);font-weight:800;font-size:52px;letter-spacing:-1px;color:var(--color-ink)}
  .note{max-width:30ch}
  .note b{font:var(--fw-bold) 13px/1.3 var(--font-heading);color:var(--color-ink);display:block;margin-bottom:4px}
  .note span{font:var(--fw-regular) 13px/1.5 var(--font-body);color:var(--text-muted)}
</style></head>
<body>
  <div class="wm">LINMEX</div>
  <div class="note"><b>Raleway 800 — substitute only</b><span>The LINMEX wordmark is a drawn logotype — always place the official logo asset, never set it in a font. Raleway is the closest digital match for rare display moments where the asset can’t be used.</span></div>
</body></html>
