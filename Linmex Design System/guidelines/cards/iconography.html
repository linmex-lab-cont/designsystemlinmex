<!-- @dsCard group="Brand" viewport="700x180" name="Iconography · Lucide" subtitle="Thin-line outline icons (1.75px), brand orange — matches deck style" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:26px 28px;background:var(--surface-card)}
  .row{display:flex;gap:30px;flex-wrap:wrap}
  .ic{display:flex;flex-direction:column;align-items:center;gap:10px;width:84px}
  .ic i{display:flex}
  .ic svg{width:34px;height:34px;color:var(--orange-500);stroke-width:1.75}
  .ic span{font:var(--fw-medium) 11px/1.2 var(--font-condensed);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);text-align:center}
</style></head>
<body>
  <div class="row">
    <div class="ic"><i data-lucide="search"></i><span>Inteligencia</span></div>
    <div class="ic"><i data-lucide="telescope"></i><span>Anticipación</span></div>
    <div class="ic"><i data-lucide="handshake"></i><span>Partner</span></div>
    <div class="ic"><i data-lucide="building-2"></i><span>Desarrollos</span></div>
    <div class="ic"><i data-lucide="trending-up"></i><span>Rentabilidad</span></div>
    <div class="ic"><i data-lucide="scale"></i><span>Certeza legal</span></div>
    <div class="ic"><i data-lucide="map-pin"></i><span>Yucatán</span></div>
  </div>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body></html>
