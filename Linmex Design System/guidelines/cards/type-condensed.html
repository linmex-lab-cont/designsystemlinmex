<!-- @dsCard group="Type" viewport="700x210" name="Eyebrows & Data · Barlow Condensed" subtitle="Secundaria — all-caps kickers, labels, tabular data" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:26px 28px;background:var(--surface-card);display:flex;flex-direction:column;gap:18px}
  .eb{font:var(--fw-semibold) 15px/1 var(--font-condensed);letter-spacing:.18em;text-transform:uppercase;color:var(--color-primary)}
  .lbl{display:flex;gap:10px;flex-wrap:wrap}
  .lbl span{font:var(--fw-semibold) 13px/1 var(--font-condensed);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 12px}
  .data{display:flex;gap:28px}
  .data div b{display:block;font:var(--fw-bold) 40px/1 var(--font-condensed);color:var(--color-ink);letter-spacing:.01em}
  .data div span{font:var(--fw-medium) 12px/1 var(--font-condensed);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
  .cap{font:var(--fw-semibold) 11px/1 var(--font-condensed);letter-spacing:.12em;text-transform:uppercase;color:var(--text-subtle);margin:0}
</style></head>
<body>
  <div><p class="cap" style="margin-bottom:6px">Eyebrow / Kicker</p><div class="eb">Eje · Liderazgo Visionario</div></div>
  <div><p class="cap" style="margin-bottom:6px">Labels</p><div class="lbl"><span>Departamentos</span><span>Lotes</span><span>Pre-venta</span></div></div>
  <div class="data">
    <div><b>+18%</b><span>Plusvalía anual</span></div>
    <div><b>12</b><span>Desarrollos</span></div>
    <div><b>97120</b><span>Mérida, Yuc.</span></div>
  </div>
</body></html>
