<!-- @dsCard group="Brand" viewport="700x220" name="Brand devices" subtitle="Diagonal orange tonal bands & the forward-leaning banner cut" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:0;background:var(--surface-card)}
  .grid{display:grid;grid-template-columns:1fr 1fr;height:220px}
  .bands{background:var(--bg-orange-bands);display:flex;align-items:flex-end;padding:22px;color:#fff}
  .bands b{font:var(--fw-bold) 22px/1.05 var(--font-heading)}
  .banner-wrap{position:relative;background:var(--gray-50);display:flex;align-items:center;justify-content:center}
  .banner{background:var(--orange-500);color:#fff;padding:14px 56px 14px 22px;clip-path:var(--clip-banner);font:var(--fw-bold) 16px/1.2 var(--font-heading)}
  .banner span{display:block;font:var(--fw-medium) 12px/1.3 var(--font-condensed);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
</style></head>
<body>
  <div class="grid">
    <div class="bands"><b>Crece tu inversión.<br>Asegura tu patrimonio.</b></div>
    <div class="banner-wrap"><div class="banner"><span>Desarrollo</span>integral &amp; sustentable</div></div>
  </div>
</body></html>
