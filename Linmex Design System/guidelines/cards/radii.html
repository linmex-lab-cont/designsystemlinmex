<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Tight, architectural corners — echoing the angular imagotipo" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:26px 28px;background:var(--surface-card)}
  .row{display:flex;gap:22px;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:74px;height:64px;background:var(--gray-100);border:1.5px solid var(--border-strong)}
  .box.o{background:var(--orange-100);border-color:var(--orange-300)}
  .item b{font:var(--fw-bold) 12px/1 var(--font-heading);color:var(--color-ink)}
  .item span{font:var(--fw-medium) 11px/1 var(--font-condensed);letter-spacing:.06em;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><b>xs</b><span>2px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><b>sm</b><span>4px</span></div>
    <div class="item"><div class="box o" style="border-radius:var(--radius-md)"></div><b>md</b><span>6px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><b>lg</b><span>10px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><b>xl</b><span>16px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><b>pill</b><span>999px</span></div>
  </div>
</body></html>
