<!-- @dsCard group="Brand" viewport="700x230" name="Photography · Duotone" subtitle="Aspirational, human imagery — full-colour or orange/navy duotone" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:0;background:var(--surface-card)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;height:230px}
  .tile{position:relative;overflow:hidden}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .duo-o img{filter:grayscale(1) contrast(1.04)}
  .duo-o::after{content:"";position:absolute;inset:0;background:var(--orange-500);mix-blend-mode:multiply}
  .duo-n img{filter:grayscale(1) contrast(1.04)}
  .duo-n::after{content:"";position:absolute;inset:0;background:var(--navy-800);mix-blend-mode:multiply;opacity:.85}
  .lbl{position:absolute;left:12px;bottom:10px;z-index:2;font:var(--fw-semibold) 11px/1 var(--font-condensed);letter-spacing:.14em;text-transform:uppercase;color:#fff}
</style></head>
<body>
  <div class="grid">
    <div class="tile"><img src="../../assets/imagery/development-street.png" alt="Desarrollo"><span class="lbl">Full colour</span></div>
    <div class="tile duo-o"><img src="../../assets/imagery/family-orange-duotone.png" alt="Familia"><span class="lbl">Duotone · naranja</span></div>
    <div class="tile duo-n"><img src="../../assets/imagery/development-street.png" alt="Desarrollo"><span class="lbl">Duotone · azul</span></div>
  </div>
</body></html>
