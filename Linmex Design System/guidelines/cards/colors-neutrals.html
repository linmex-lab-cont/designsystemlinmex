<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Cool greys tuned toward the navy — surfaces, borders, text" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-card)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .sw b{font:var(--fw-bold) 12px/1 var(--font-heading)}
  .sw span{font:var(--fw-semibold) 10px/1.4 var(--font-condensed);letter-spacing:.04em;opacity:.7}
  .cap{font:var(--fw-semibold) 11px/1 var(--font-condensed);letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 12px}
</style></head>
<body>
  <p class="cap">Grises · Neutrales</p>
  <div class="row">
    <div class="sw" style="background:var(--white);color:#0F1820"><b>White</b><span>#FFFFFF</span></div>
    <div class="sw" style="background:var(--gray-50);color:#0F1820"><b>50</b><span>#F6F6F4</span></div>
    <div class="sw" style="background:var(--gray-100);color:#0F1820"><b>100</b><span>#EDEDEA</span></div>
    <div class="sw" style="background:var(--gray-200);color:#0F1820"><b>200</b><span>#DEDFDB</span></div>
    <div class="sw" style="background:var(--gray-300);color:#0F1820"><b>300</b><span>#C5C7C2</span></div>
    <div class="sw" style="background:var(--gray-400);color:#fff"><b>400</b><span>#9DA09B</span></div>
    <div class="sw" style="background:var(--gray-500);color:#fff"><b>500</b><span>#6E726E</span></div>
    <div class="sw" style="background:var(--gray-600);color:#fff"><b>600</b><span>#4C504D</span></div>
    <div class="sw" style="background:var(--gray-700);color:#fff"><b>700</b><span>#343735</span></div>
  </div>
</body></html>
