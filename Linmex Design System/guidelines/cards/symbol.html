<!-- @dsCard group="Brand" viewport="700x230" name="Imagotipo & meaning" subtitle="Three forward-leaning bars: Crecimiento · Dirección · Metodología" -->
<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:30px 32px;background:var(--surface-card);display:flex;align-items:center;gap:40px}
  .mark{width:120px;height:120px;color:var(--orange-500);flex:0 0 auto}
  .mark svg{width:100%;height:100%}
  .meaning{display:flex;flex-direction:column;gap:14px}
  .meaning .eyebrow{margin:0}
  .bars{display:flex;gap:24px}
  .bars div b{display:block;font:var(--fw-bold) 15px/1.2 var(--font-heading);color:var(--color-ink)}
  .bars div span{font:var(--fw-regular) 12px/1.4 var(--font-body);color:var(--text-muted);max-width:14ch;display:block}
</style></head>
<body>
  <div class="mark">
    <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <polygon fill="currentColor" points="0,0 1000,0 746,333 0,333"/>
      <polygon fill="currentColor" points="681,333 1000,333 1000,667 424,667"/>
      <polygon fill="currentColor" points="0,668 484,668 201,1000 0,1000"/>
    </svg>
  </div>
  <div class="meaning">
    <p class="eyebrow">El símbolo</p>
    <div class="bars">
      <div><b>Crecimiento</b><span>oportunidades de inversión</span></div>
      <div><b>Dirección</b><span>asesoría y soluciones</span></div>
      <div><b>Metodología</b><span>procesos sistémicos</span></div>
    </div>
  </div>
</body></html>
