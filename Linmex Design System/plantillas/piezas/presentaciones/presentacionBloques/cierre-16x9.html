<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bloques · cierre · 16:9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F1EC}
.eb{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.18em}
.cf{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F3F1EC; color: #0F1820; font-family: 'Cairo', sans-serif">
  <div style="position: absolute; left: 0; top: 0; width: 780px; height: 1080px; background: #FF5100"></div>

  <img src="../../_img/linmex-logo-blanco-solido.png" alt="LINMEX" style="position: absolute; left: 96px; top: 96px; height: 48px; width: auto; display: block">

  <div style="position: absolute; left: 96px; bottom: 96px; width: 612px; color: #FFFFFF">
    <h1 style="margin: 0; font-size: 152px; font-weight: 800; line-height: 1; letter-spacing: -.025em" data-campo="cierreTitulo">Gracias</h1>
    <p style="margin: 36px 0 0; font-size: 40px; font-weight: 700; line-height: 1.25" data-campo="cierrePregunta">¿Preguntas?</p>
    <p style="margin: 8px 0 0; font-size: 30px; font-weight: 700; line-height: 1.35" data-campo="cierreMensaje">Con gusto te respondemos.</p>
  </div>

  <div style="position: absolute; left: 900px; top: 132px; width: 900px; height: 600px; box-sizing: border-box; padding: 56px 64px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,24,32,.06); display: flex; flex-direction: column; justify-content: space-between">
    <div class="eb" style="font-size: 22px; line-height: 1.2; color: #56616B">Contacto</div>
    <div>
      <div style="display: flex; align-items: baseline; gap: 32px; padding: 22px 0; border-top: 1px solid rgba(15,24,32,.12)">
        <span class="eb" style="width: 150px; flex-shrink: 0; font-size: 20px; color: #56616B">Teléfono</span>
        <span style="font-size: 34px; font-weight: 700; line-height: 1.3">(999) 343 7716</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 32px; padding: 22px 0; border-top: 1px solid rgba(15,24,32,.12)">
        <span class="eb" style="width: 150px; flex-shrink: 0; font-size: 20px; color: #56616B">Correo</span>
        <span style="font-size: 34px; font-weight: 700; line-height: 1.3">contacto@grupolinmex.mx</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 32px; padding: 22px 0; border-top: 1px solid rgba(15,24,32,.12)">
        <span class="eb" style="width: 150px; flex-shrink: 0; font-size: 20px; color: #56616B">Sitio</span>
        <span style="font-size: 34px; font-weight: 700; line-height: 1.3">grupolinmex.mx</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 32px; padding: 22px 0 0; border-top: 1px solid rgba(15,24,32,.12)">
        <span class="eb" style="width: 150px; flex-shrink: 0; font-size: 20px; color: #56616B">Oficina</span>
        <span style="font-size: 28px; font-weight: 400; line-height: 1.4; color: #3F4A54">Calle 19 #269A x 36 y 38, Col. Campestre,<br>C.P. 97120, Mérida, Yucatán</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 900px; bottom: 96px; width: 720px">
    <div class="eb" style="font-size: 20px; line-height: 1.2; color: #56616B" data-campo="cierrePresentoRotulo">Presentó</div>
    <div style="margin-top: 10px; font-size: 32px; font-weight: 700; line-height: 1.25" data-campo="cierrePresentador">[Nombre Apellido]</div>
    <div style="margin-top: 4px; font-size: 26px; font-weight: 400; line-height: 1.4; color: #3F4A54" data-campo="cierrePuestoCorreo">[Puesto] · [nombre@grupolinmex.mx]</div>
  </div>

  <div style="position: absolute; left: 1680px; top: 672px; width: 180px; height: 180px; box-sizing: border-box; padding: 28px; border-radius: 10px; background: #0F1820; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between">
    <div class="cf" style="font-size: 72px" data-campo="cierreInsignia">06</div>
    <div class="eb" style="font-size: 20px; line-height: 1; color: rgba(255,255,255,.78)" data-campo="cierreInsigniaPeriodo">3T 2026</div>
  </div>
</div>
</body>
</html>
