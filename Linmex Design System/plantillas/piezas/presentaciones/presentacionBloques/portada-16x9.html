<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bloques · portada · 16:9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F1EC}
.eb{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.18em}
.cf{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F3F1EC; color: #0F1820; font-family: 'Cairo', sans-serif">
  <div style="position: absolute; left: 0; top: 0; width: 780px; height: 1080px; background: #FF5100"></div>

  <img src="../../_img/linmex-logo-blanco-solido.png" alt="LINMEX" style="position: absolute; left: 96px; top: 96px; height: 48px; width: auto; display: block">

  <div style="position: absolute; left: 96px; bottom: 96px; width: 612px; color: #FFFFFF">
    <div class="eb" style="font-size: 26px; line-height: 1.2" data-campo="portadaRotulo">Dirección Comercial</div>
    <h1 style="margin: 28px 0 0; font-size: 104px; font-weight: 800; line-height: 1; letter-spacing: -.02em" data-campo="portadaTitulo">Resultados del tercer trimestre</h1>
    <p style="margin: 40px 0 0; font-size: 34px; font-weight: 700; line-height: 1.3" data-campo="portadaPeriodo">Julio a septiembre de 2026</p>
  </div>

  <img data-imagen="portadaFoto" src="../../_img/referidos-soletta.jpg" alt="Terraza frente al mar en Soletta" style="position: absolute; left: 900px; top: 132px; width: 900px; height: 600px; object-fit: cover; object-position: 50% 50%; border-radius: 10px; display: block">

  <div style="position: absolute; left: 1680px; top: 672px; width: 180px; height: 180px; box-sizing: border-box; padding: 28px; border-radius: 10px; background: #0F1820; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between">
    <div class="cf" style="font-size: 72px" data-campo="portadaInsignia">3T</div>
    <div class="eb" style="font-size: 20px; line-height: 1; color: rgba(255,255,255,.78)" data-campo="portadaInsigniaAnio">2026</div>
  </div>

  <div style="position: absolute; left: 900px; bottom: 96px; width: 720px">
    <div class="eb" style="font-size: 20px; line-height: 1.2; color: #56616B" data-campo="portadaPresentaRotulo">Presenta</div>
    <div style="margin-top: 10px; font-size: 32px; font-weight: 700; line-height: 1.25" data-campo="portadaPresentador">[Nombre Apellido]</div>
    <div style="margin-top: 4px; font-size: 26px; font-weight: 400; line-height: 1.4; color: #3F4A54" data-campo="portadaPuestoFecha">[Puesto] · 6 de octubre de 2026</div>
  </div>
</div>
</body>
</html>
