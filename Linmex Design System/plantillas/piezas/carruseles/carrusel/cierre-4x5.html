<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrusel informativo · cierre con QR · 4:5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#0F1820}
.eb{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.18em}
.cf{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
</style>
</head>
<body>
<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #0F1820; color: #FFFFFF; font-family: 'Cairo', sans-serif">
  <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; background: radial-gradient(880px 620px at 14% -10%, rgba(255,176,124,.24), rgba(255,81,0,.1) 42%, transparent 74%)"></div>

  <div class="eb" style="position: absolute; left: 72px; top: 96px; font-size: 24px; color: rgba(255,255,255,.78)" data-campo="cierreRotulo">¿Dudas?</div>
  <h1 style="position: absolute; left: 72px; top: 138px; width: 936px; margin: 0; font-size: 80px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; text-wrap: balance" data-campo="cierreTitulo">Entra al HUB y envía tu reporte a tiempo</h1>
  <p style="position: absolute; left: 72px; top: 334px; width: 900px; margin: 0; font-size: 32px; line-height: 1.45; color: rgba(255,255,255,.86)" data-campo="cierreTexto">Si algo no te cuadra, escríbele a [área o responsable].</p>

  <div style="position: absolute; left: 72px; top: 492px; width: 936px; height: 560px; border-radius: 10px; overflow: hidden; z-index: 0; border: 1px solid rgba(255,255,255,.22); box-shadow: 0 44px 96px rgba(4,9,14,.48)">
    <div style="position: absolute; left: 0; top: 0; width: 936px; height: 560px; z-index: -1; background: linear-gradient(155deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.03) 42%, rgba(255,255,255,0) 100%), rgba(24,36,47,.72)"></div>
    <div style="position: absolute; left: 0; top: 0; width: 936px; height: 1px; background: rgba(255,255,255,.36)"></div>

    <img data-imagen="cierreQr" src="../../_img/qr-ejemplo.svg" alt="Código QR del enlace" style="position: absolute; left: 48px; top: 80px; width: 400px; height: 400px; border-radius: 4px; background: #FFFFFF; object-fit: contain; display: block">

    <div style="position: absolute; left: 496px; top: 80px; width: 392px">
      <div class="eb" style="font-size: 22px; color: #FFCDB0">Escanea con tu celular</div>
      <div style="font-size: 42px; font-weight: 800; line-height: 1.12; margin-top: 14px; text-wrap: balance" data-campo="cierreMensaje">Tu quincena y tus reportes en un solo lugar.</div>
      <div class="cf" style="font-size: 34px; margin-top: 24px; letter-spacing: .02em" data-campo="cierreEnlace">hub.grupolinmex.mx</div>
    </div>
    <div style="position: absolute; left: 496px; top: 412px; width: 300px; height: 68px; border-radius: 4px; background: #FF5100; box-shadow: 0 18px 40px rgba(255,81,0,.34); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800" data-campo="cierreBoton">Entrar al HUB</div>
  </div>

  <div style="position: absolute; left: 72px; top: 1242px; width: 936px; height: 36px; display: flex; align-items: center; justify-content: space-between">
    <img src="../../_img/linmex-logo-blanco.png" alt="LINMEX" style="height: 36px; width: auto; display: block">
    <span class="cf" style="font-size: 24px; color: rgba(255,255,255,.72)">04 / 04</span>
  </div>
</div>
</body>
</html>
