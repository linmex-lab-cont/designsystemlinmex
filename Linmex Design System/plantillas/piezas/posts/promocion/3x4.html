<!doctype html>

<style>
body{margin:0;background:#0F1820}
.eb{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.18em}

</style>
</head>
<body>

  <div style="position: absolute; left: 48px; top: 48px; width: 984px; height: 664px; border-radius: 10px; overflow: hidden; z-index: 0; border: 1px solid rgba(255,255,255,.26); box-shadow: 0 40px 90px rgba(4,9,14,.48)">

    <h1 style="position: absolute; left: 54px; top: 92px; width: 876px; margin: 0; font-size: 56px; font-weight: 800; line-height: 1.04; letter-spacing: -.01em; text-wrap: balance" data-campo="titulo">Crece tu inversión. Asegura tu patrimonio.</h1>

    <div style="position: absolute; left: 54px; top: 244px; width: 304px; height: 154px; box-sizing: border-box; padding: 0 24px; border-radius: 4px; background: #FF5100; box-shadow: 0 18px 40px rgba(255,81,0,.38); display: flex; align-items: center; gap: 16px">
      <div class="cf" style="font-size: 120px" data-campo="beneficioCifra">3</div>
      <div>
        <div class="eb" style="font-size: 22px; line-height: 1.2" data-campo="beneficioRotulo">Mensualidades gratis</div>
        <div style="font-size: 19px; font-weight: 700; line-height: 1.25; margin-top: 6px" data-campo="beneficioCondicion">al apartar tu lote</div>
      </div>
    </div>
    <div style="position: absolute; left: 398px; top: 244px; width: 532px; height: 154px; display: flex; align-items: center; gap: 48px">
      <div>
        <div class="eb" style="font-size: 18px; color: rgba(255,255,255,.8)" data-campo="loteRotulo">Lotes desde</div>
        <div class="cf" style="font-size: 46px; margin-top: 10px" data-campo="loteValor">[000] m²</div>
      </div>
      <div>
        <div class="eb" style="font-size: 18px; color: rgba(255,255,255,.8)" data-campo="mensualidadRotulo">Mensualidades desde</div>
        <div class="cf" style="font-size: 46px; margin-top: 10px" data-campo="mensualidadValor">[$0,000]</div>
      </div>

    <div style="position: absolute; left: 54px; top: 432px; width: 304px; height: 62px; border-radius: 4px; background: #FFFFFF; color: #0F1820; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700" data-campo="boton">Contacta a tu consultor</div>
    <p style="position: absolute; left: 398px; top: 432px; width: 532px; margin: 0; font-size: 19px; line-height: 1.45; color: rgba(255,255,255,.86)"><span data-campo="vigencia">Vigencia del 1 al 30 de noviembre de 2026.</span> Consulta términos y condiciones.</p>

    <div style="position: absolute; left: 54px; top: 534px; width: 876px; height: 1px; background: rgba(255,255,255,.18)"></div>
    <div style="position: absolute; left: 54px; top: 570px; width: 876px; height: 40px; display: flex; align-items: center; justify-content: space-between">
      <img src="../../_img/linmex-logo-blanco.png" alt="LINMEX" style="height: 40px; width: auto; display: block">
      <span class="eb" style="font-size: 21px; letter-spacing: .14em; color: rgba(255,255,255,.86)">grupolinmex.mx</span>
