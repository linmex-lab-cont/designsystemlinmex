<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:26px 28px;background:var(--surface-page)}
  .block{margin-bottom:22px}
  .lbl{font:var(--fw-semibold) 11px/1 var(--font-condensed);letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 12px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  #root{}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Badge, Card, Input, Stat } = window.LinmexDesignSystem_fdd2a9;
    function Demo() {
      return (
        <div>
          <div className="block">
            <p className="lbl">Buttons</p>
            <div className="row">
              <Button variant="primary">Agenda una cita</Button>
              <Button variant="secondary">Ver desarrollos</Button>
              <Button variant="outline">Brochure</Button>
              <Button variant="ghost">Más info</Button>
              <Button variant="primary" size="sm">Pequeño</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
          </div>
          <div className="block">
            <p className="lbl">Badges</p>
            <div className="row">
              <Badge tone="orange" variant="solid">Pre-venta</Badge>
              <Badge tone="success" dot>Disponible</Badge>
              <Badge tone="navy" variant="soft" shape="square">Departamento</Badge>
              <Badge tone="warning">Últimas unidades</Badge>
              <Badge tone="neutral" variant="outline">Lote</Badge>
            </div>
          </div>
          <div className="row" style={{alignItems:'stretch'}}>
            <Card padding="md" style={{flex:'1 1 240px'}}>
              <Input label="Correo electrónico" type="email" placeholder="tu@correo.com" />
            </Card>
            <Card accent padding="md" style={{flex:'1 1 240px',display:'flex',gap:'28px'}}>
              <Stat value="+18%" label="Plusvalía" />
              <Stat value="12" label="Desarrollos" />
              <Stat value="100%" label="Escriturado" tone="orange" />
            </Card>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
