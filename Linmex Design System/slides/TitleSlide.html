<!DOCTYPE html><html lang="es"><head>

<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#222}
  .slide{position:relative;width:1280px;height:720px;background:var(--navy-800);overflow:hidden;color:#fff;font-family:var(--font-body)}
  .bands{position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(115deg,var(--navy-800) 0 100px,var(--navy-700) 100px 200px)}
  .mark{position:absolute;right:-60px;bottom:-80px;opacity:.08}
  .inner{position:relative;height:100%;box-sizing:border-box;padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between}
  .wm{display:flex;align-items:center;gap:14px}
  .wm span{font:800 30px/1 var(--font-logo);letter-spacing:-.5px}
  .eyebrow{color:var(--orange-400);font:var(--fw-semibold) 17px/1 var(--font-condensed);letter-spacing:.18em;text-transform:uppercase;margin-bottom:24px;display:block}
  h1{font:800 76px/1.02 var(--font-heading);letter-spacing:-.02em;margin:0;max-width:18ch}
  h1 b{color:var(--orange-400);font-weight:800}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font:var(--fw-semibold) 15px/1 var(--font-condensed);letter-spacing:.06em;color:var(--text-on-dark-dim)}
  .rule{width:64px;height:5px;background:var(--orange-500);transform:skewX(-20deg);margin:0 0 34px}
</style></head>
<body style="">
  <div class="slide">
    <div class="bands"></div>
    <svg class="mark" width="560" height="560" viewBox="0 0 1000 1000"><polygon fill="#FF5100" points="0,0 1000,0 746,333 0,333"></polygon><polygon fill="#FF5100" points="681,333 1000,333 1000,667 424,667"></polygon><polygon fill="#FF5100" points="0,668 484,668 201,1000 0,1000"></polygon></svg>
    <div class="inner">
      <img class="wm" src="../assets/logo/Linmex-Logo-Blanco.png" alt="Linmex" style="height:40px;width:auto;display:block;align-self:flex-start">
      <div>
        <span class="eyebrow">Plan estratégico · 2026</span>
        <div class="rule"></div>
        <h1 style=""><span style="color: rgb(255, 255, 255);">Construimos</span> <b style="">certeza</b> <span style="color: rgb(255, 255, 255);">inmobiliaria en Yucatán.</span></h1>
      </div>
      <div class="foot"><span style="">grupolinmex.mx</span><span style="">Desarrollo Inmobiliario con Rentabilidad y Propósito</span></div>
    </div>
  </div>

</body></html>
